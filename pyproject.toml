[project]
name = "forge"
version = "0.1.0"
description = "FORGE — Fraud Offense-defense Research and Generation Engine (Mastercard Innovation Challenge @ GFF 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-ai>=2.33,<2.34",
    "inngest==0.5.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "numpy>=2.2,<3",
    "faker>=40.37,<41",
    "networkx>=3.6.1,<4",
    "pyarrow>=18",
    "pandas>=2.2",
]

[project.optional-dependencies]
detect = ["lightgbm==4.7.0", "scikit-learn>=1.9"]
analyst = ["trl>=0.19", "peft>=0.15", "bitsandbytes>=0.45"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
