name: forge

x-forge-env: &forge-env
  INNGEST_DEV: ${INNGEST_DEV:-1}
  INNGEST_BASE_URL: http://inngest:8288
  INNGEST_CONNECT_GATEWAY: ws://inngest:8289/v0/connect
  INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?set INNGEST_EVENT_KEY}
  INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?set INNGEST_SIGNING_KEY}
  FORGE_APP_VERSION: ${FORGE_APP_VERSION:?set FORGE_APP_VERSION}
  FORGE_CONFIG: /app/configs/settings.yaml
  FORGE_VENDOR_DIR: /app/vendor
  FORGE_DATA_DIR: /app/data
  FORGE_FRONTEND_DIST: /app/frontend/dist
  FORGE_DATABASE_URL: postgresql://forge:${FORGE_DB_PASSWORD:?set FORGE_DB_PASSWORD}@postgres:5432/forge?sslmode=disable
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: forge-artifacts
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_CONTAINER_BASE_URL:-${OPENAI_BASE_URL:?set OPENAI_BASE_URL}}
  FORGE_LLM_MODEL: ${FORGE_LLM_MODEL:-mimo-v2.5}
  FORGE_LLM_FALLBACK_MODEL: ${FORGE_LLM_FALLBACK_MODEL:-mimo-v2.5}
  FORGE_LIVE_LLM: "1"
  FORGE_RUN_ID: ${FORGE_RUN_ID:?set FORGE_RUN_ID}
  FORGE_RUN_DURATION_HOURS: ${FORGE_RUN_DURATION_HOURS:-96}
  FORGE_MAX_CYCLES: ${FORGE_MAX_CYCLES:-500}
  FORGE_MAX_STORAGE_BYTES: ${FORGE_MAX_STORAGE_BYTES:-536870912000}
  FORGE_QUEUE_CAPACITY: ${FORGE_QUEUE_CAPACITY:-100}
  FORGE_WORKER_REPLICAS: ${FORGE_WORKER_REPLICAS:-5}
  FORGE_CAMPAIGN_ENABLED: ${FORGE_CAMPAIGN_ENABLED:-0}
  FORGE_CAMPAIGN_INTERVAL_MINUTES: ${FORGE_CAMPAIGN_INTERVAL_MINUTES:-10}
  FORGE_CAMPAIGN_FAMILIES_PER_SLOT: ${FORGE_CAMPAIGN_FAMILIES_PER_SLOT:-3}
  FORGE_CAMPAIGN_BEHAVIORAL_PER_SLOT: ${FORGE_CAMPAIGN_BEHAVIORAL_PER_SLOT:-1}
  FORGE_CAMPAIGN_FAMILIES: ${FORGE_CAMPAIGN_FAMILIES:-ai_bank_impersonation,deepfake_executive_bec,agent_prompt_injection_payment_hijack,ai_family_emergency,ai_investment_coaching,synthetic_kyc_account_factory}
  FORGE_OPERATOR_TOKEN: ${FORGE_OPERATOR_TOKEN:-}
  FORGE_STOP_AT: ${FORGE_STOP_AT:-}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
  SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
  SMTP_TO: ${SMTP_TO:?set SMTP_TO}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      FORGE_DB_PASSWORD: ${FORGE_DB_PASSWORD:?set FORGE_DB_PASSWORD}
    volumes:
      - ./data/services/postgres:/var/lib/postgresql/data
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-forge.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$FORGE_DB_PASSWORD psql -h 127.0.0.1 -U forge -d forge -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["./data/services/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["./data/services/minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/forge-artifacts &&
        mc version enable local/forge-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  inngest:
    image: inngest/inngest:v1.19.3
    restart: unless-stopped
    command: ["inngest", "start"]
    environment:
      INNGEST_POSTGRES_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/inngest?sslmode=disable
      INNGEST_REDIS_URI: redis://redis:6379/0
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_QUEUE_WORKERS: "20"
      INNGEST_EXPERIMENTAL_PROM_METRICS: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8288", "8289"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 10m

  forge-bootstrap:
    build: .
    image: forge:${FORGE_APP_VERSION}
    restart: "no"
    user: "${FORGE_HOST_UID:-1000}:${FORGE_HOST_GID:-1000}"
    command: ["python", "-m", "forge.operations.bootstrap"]
    environment:
      FORGE_DATA_DIR: /app/data
      FORGE_DATABASE_URL: postgresql://forge:${FORGE_DB_PASSWORD}@postgres:5432/forge?sslmode=disable
    volumes:
      - ./data:/app/data
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    image: forge:${FORGE_APP_VERSION}
    restart: unless-stopped
    init: true
    user: "${FORGE_HOST_UID:-1000}:${FORGE_HOST_GID:-1000}"
    environment:
      <<: *forge-env
      FORGE_INNGEST_MODE: connect
    depends_on:
      forge-bootstrap: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      inngest: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    image: forge:${FORGE_APP_VERSION}
    restart: unless-stopped
    init: true
    user: "${FORGE_HOST_UID:-1000}:${FORGE_HOST_GID:-1000}"
    command: ["python", "-m", "forge.pipeline.worker"]
    environment:
      <<: *forge-env
      INNGEST_CONNECT_MAX_WORKER_CONCURRENCY: "1"
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      TINYFISH_MCP_URL: ${TINYFISH_MCP_URL:-http://tinyfish-mcp:3711/mcp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      forge-bootstrap: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      inngest: { condition: service_healthy }
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/app/data
    deploy:
      replicas: ${FORGE_WORKER_REPLICAS:-5}
      resources:
        limits:
          memory: 2G

  tinyfish-mcp:
    image: node:22-alpine
    profiles: ["research"]
    restart: unless-stopped
    command: ["npx", "-y", "@tiny-fish/mcp"]
    environment:
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
    network_mode: host
